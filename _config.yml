title: Andrew McKnight
description: Lover of programming, art, learning, outdoors, food, culture and travel.
url: https://mcknight.io
exclude:
  - Makefile
  - README.md
  # travel.mcknight.io is a separate Jekyll site that happens to live in this
  # repo. Without this, the parent would render its pages a second time and
  # copy its build output into its own.
  - travel
  # Written straight into _site by `make deploy`, so a build never copies a
  # stale stamp over the live one.
  - DEPLOYED
  - .gitignore
  - Brewfile*
  - Gemfile*
  - logs/
  - .git/
tag_page_layout: tag_page
tag_page_dir: blog/tag
tag_feed_layout: tag_feed
tag_feed_dir: blog/tag
