# Every job, for two readers: the experience page (experience/index.html)
# and the CV and resumes (scripts/generate-resume.rb, through the resume repo's
# resume.tex.erb). Which jobs a resume has, and in what order, its entry in
# the resume repo's selections.yml says, by id; the page shows every job and
# sorts them by date itself.
#
# Each entry:
#
#   id               A short name for the job, unique here, e.g. "sentry":
#                    what a resume's selection file lists it by.
#   start            "January 2021": a full month name and the year, or just
#                    the year. Both readers parse it; the CV shortens it to
#                    "Jan 2021".
#   end              The same, or "Current" for ongoing work.
#   organization     Who the work was for: a company, or a school for work
#                    done there. The page's timeline names the entry by it.
#   title            The role, e.g. "Senior Software Engineer".
#   location         "Remote", "Cambridge, MA", "Norfolk, VA & Remote".
#   employment_type  "FTE", "Contract", "Intern"... Plain text: the page
#                    writes "location · type", the CV "(type)".
#   era              Only a grouping key. The timeline draws one branch
#                    (one line, colour and lane) per organization + era, so
#                    two entries with the same organization and era are
#                    drawn as one branch, and the same organization in two
#                    eras as two. It does not change the order of anything.
#                    Values so far: professional, semi-pro, higher-education,
#                    foodservice. The page gives education its own era.
#   stack            Optional. A list of one-key maps, category to items:
#                      - languages: [Swift, Objective-C++]
#                      - tools: [XcodeGen, Fastlane]
#                    Categories so far: languages, frameworks, tools,
#                    infrastructure, platforms. The page shows
#                    them as tag groups; the CV joins every item, in order,
#                    on one "Stack" line.
#   deliverables     Optional. What was built. Each item is either a string,
#                    or a map:
#                      name         what it is called
#                      url          optional; links the name
#                      description  optional; follows the name, "name: description"
#                      details      optional; a list of strings under it
#                    The CV writes a lone string inline after "Deliverables:",
#                    and anything else as a nested list.
#   highlights       Optional. Each item is a string, or a map of name, url
#                    and description, where the description mentions the name
#                    and that mention becomes the link.
#
# In any text: `backticks` mark code, which the CV sets in typewriter type,
# and "straight quotes" become curly ones there. Write & and other characters
# as they are; the CV escapes them for LaTeX.
experience:
  - id: sentry
    start: January 2021
    end: Current
    era: professional
    organization: Sentry
    title: Senior Software Engineer
    location: Remote
    employment_type: FTE
    stack:
      - languages: [Objective-C++, Swift, Python]
      - frameworks: [SwiftUI, Django]
      - tools: [XcodeGen, CocoaPods, SPM, Carthage, Swiftlint, clang-format, CodeCov, pre-commit, Fastlane, Arkana, Claude Code]
      - infrastructure: [GitHub Actions, SauceLabs, TestFlight, Linear]
    deliverables:
      - name: Sentry Cocoa SDK
        url: https://github.com/getsentry/sentry-cocoa
        description: mobile app crash and performance monitoring
        details:
          - Integrated Specto's profiler into Sentry's Cocoa SDK and iterated with new API/features
          - "User Feedback widget: first user-facing UI shipped in Sentry Cocoa SDK"
          - Built and maintained sample and demo apps for developers and Sales team
          - "CI overhauls: parallelized long-running jobs, modularized suites, fixed state corruption issues, standardized fixtures"
      - name: Seer for iOS and macOS
        description: experimental apps interacting with our agentic offerings
      - name: SaaS Billing Platformization
        description: helped overhaul the company's internal billing codebase to help product teams self-serve how they charge for their product segment

