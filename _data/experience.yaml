      - tools: [Claude Code, SPM, XcodeGen, CocoaPods, Carthage, Swiftlint, clang-format, CodeCov, pre-commit, Fastlane, Arkana]
      - infrastructure: [GitHub Actions, Redash, SauceLabs, TestFlight, Linear]
