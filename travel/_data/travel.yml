# Places visited, for a future travel visualization.
#
# Four nested dimensions, so a visualization can aggregate at any level without
# deriving the hierarchy itself: continent > country > region > city.
#
#   continents:
#     - name:                  display name
#       countries:
#         - name:
#           code:              ISO 3166-1 alpha-2
#           regions:
#             - name:
#               code:          ISO 3166-2
#               kind:          state | province | territory | region | prefecture |
#                              county | federal district
#               cities:
#                 - name:
#
# `kind` exists because the second level is not "state or province" everywhere:
# Japan has prefectures, Ireland counties, France régions, and Washington is in a
# federal district that is not a state at all.
#
# DATES (to add later)
#
# Any entry at any level may carry a `dates:` list, so a country or region passed
# through without stopping in a listed city can still be dated. Each element is
# either a single day or a range:
#
#   cities:
#     - name: Reykjavík
#       dates:
#         - 2019-06-12                        # a single day
#         - { from: 2022-08-01, to: 2022-08-09 }   # a stay
#         - { from: 2024-03, to: 2024-04 }    # month precision, when the day is lost
#
# Unquoted full dates parse as dates in Jekyll; a bare `2024-03` stays a string.
# Keep whichever precision is true rather than inventing a day.
#
# A city appears once, however many times it was visited — repeat visits are
# entries in its `dates` list, not duplicate cities.

